# Twitter/X API 配置文件
# 用于 AI 信息收集项目的共享 Twitter API 配置

# Twitter API Key
TWITTER_API_KEY="${TWITTER_API_KEY}"

# API 基础地址
API_BASE="https://api.twitterapi.io"

# 搜索结果数量（默认）
DEFAULT_RESULTS_COUNT=10

# 请求超时
TIMEOUT=30

# 缓存设置
CACHE_DIR="/root/clawd/.cache/twitter"
CACHE_TTL=1800  # 30 分钟（Twitter 数据变化快）

# 日志设置
LOG_DIR="/root/clawd/logs/twitter"
LOG_LEVEL="INFO"

# 速率限制
RATE_LIMIT_PER_MINUTE=10
RATE_LIMIT_PER_HOUR=100

# 搜索配置
SEARCH_INCLUDE_RETWEETS=false
SEARCH_INCLUDE_REPLIES=false
