# SearXNG 配置文件
# 用于 AI 信息收集项目的共享 SearXNG 配置

# SearXNG 实例地址
SEARXNG_URL="http://localhost:8080"

# 搜索结果数量（默认）
DEFAULT_RESULTS_COUNT=10

# 搜索类别
SEARCH_CATEGORIES="general,science,it"

# 代理设置（如果需要）
# PROXY="--noproxy '*'"
PROXY="--noproxy '*'"

# 超时设置
TIMEOUT=30

# 缓存设置
CACHE_DIR="/root/clawd/.cache/searxng"
CACHE_TTL=3600

# 日志设置
LOG_DIR="/root/clawd/logs/searxng"
LOG_LEVEL="INFO"
