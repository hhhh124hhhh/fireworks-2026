version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SECRET=supersecretkey123456789
      - BASE_URL=http://localhost:8080/
    networks:
      - searxng-net

networks:
  searxng-net:
    driver: bridge
