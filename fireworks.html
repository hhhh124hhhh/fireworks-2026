<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马年大吉 - 烟花</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: auto;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .control-btn:hover {
            background: rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }

        .control-btn.active {
            background: rgba(255, 215, 0, 0.6);
            color: #000;
        }

        .control-btn.inactive {
            background: rgba(128, 128, 128, 0.2);
            border-color: #808080;
            color: #808080;
        }

        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #d4af37, 0 0 40px #d4af37, 0 0 60px #ff6b00;
            z-index: 10;
            pointer-events: none;
            animation: glow 3s ease-in-out infinite alternate;
        }

        .subtitle {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffdf00;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            opacity: 0.9;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 10px #d4af37, 0 0 20px #ff6b00;
        }

        .horse-icon {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            z-index: 10;
            pointer-events: none;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px #d4af37, 0 0 40px #d4af37, 0 0 60px #ff6b00;
            }
            to {
                text-shadow: 0 0 30px #ff6b00, 0 0 60px #d4af37, 0 0 90px #d4af37;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.2rem;
                top: 68%;
            }
            .horse-icon {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    <div class="horse-icon">🐎</div>
    <div class="title">马年大吉 🎊</div>
    <div class="subtitle">点击屏幕或等待自动播放烟花</div>

    <div class="controls">
        <button id="musicBtn" class="control-btn active">🎵 音乐</button>
        <button id="sfxBtn" class="control-btn active">🔊 音效</button>
    </div>

    <script>
        // ===== 音频系统 =====
        const AudioSystem = {
            audioContext: null,
            isMusicPlaying: true,
            isSfxEnabled: true,
            backgroundMusic: null,

            // 初始化音频上下文
            init: function() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            },

            // 播放喜庆的背景音乐（循环旋律）
            playBackgroundMusic: function() {
                if (!this.isMusicPlaying || !this.audioContext) return;

                // 喜庆的音符序列（C大调五声音阶）
                const notes = [
                    { freq: 523.25, duration: 0.5 },  // C5
                    { freq: 659.25, duration: 0.5 },  // E5
                    { freq: 783.99, duration: 0.5 },  // G5
                    { freq: 1046.50, duration: 1.0 }, // C6
                    { freq: 783.99, duration: 0.5 },  // G5
                    { freq: 659.25, duration: 0.5 },  // E5
                    { freq: 523.25, duration: 1.0 },  // C5
                    { freq: 587.33, duration: 0.5 },  // D5
                    { freq: 783.99, duration: 0.5 },  // G5
                    { freq: 987.77, duration: 1.0 },  // B5
                    { freq: 783.99, duration: 0.5 },  // G5
                    { freq: 587.33, duration: 0.5 },  // D5
                    { freq: 523.25, duration: 2.0 },  // C5
                ];

                let noteIndex = 0;
                const playNote = () => {
                    if (!this.isMusicPlaying || !this.audioContext) return;

                    const note = notes[noteIndex];
                    this.playNote(note.freq, note.duration, 0.3, 'triangle');

                    noteIndex = (noteIndex + 1) % notes.length;
                    setTimeout(playNote, note.duration * 800);
                };

                playNote();
            },

            // 播放单个音符
            playNote: function(frequency, duration, volume = 0.3, type = 'sine') {
                if (!this.audioContext) return;

                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = type;

                gainNode.gain.setValueAtTime(volume, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);

                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + duration);
            },

            // 播放爆炸音效
            playExplosionSound: function() {
                if (!this.isSfxEnabled || !this.audioContext) return;

                // 主爆炸声（低频噪声）
                const bufferSize = this.audioContext.sampleRate * 0.5; // 0.5秒
                const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noiseSource = this.audioContext.createBufferSource();
                noiseSource.buffer = buffer;

                const noiseFilter = this.audioContext.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 1000;

                const noiseGain = this.audioContext.createGain();
                noiseGain.gain.setValueAtTime(0.5, this.audioContext.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.5);

                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(this.audioContext.destination);

                noiseSource.start(this.audioContext.currentTime);
                noiseSource.stop(this.audioContext.currentTime + 0.5);

                // 高频嘶嘶声
                const highOsc = this.audioContext.createOscillator();
                const highGain = this.audioContext.createGain();
                const highFilter = this.audioContext.createBiquadFilter();

                highOsc.type = 'sawtooth';
                highOsc.frequency.value = 2000;
                highFilter.type = 'highpass';
                highFilter.frequency.value = 3000;

                highGain.gain.setValueAtTime(0.1, this.audioContext.currentTime);
                highGain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);

                highOsc.connect(highFilter);
                highFilter.connect(highGain);
                highGain.connect(this.audioContext.destination);

                highOsc.start(this.audioContext.currentTime);
                highOsc.stop(this.audioContext.currentTime + 0.3);

                // 低音轰鸣
                const bassOsc = this.audioContext.createOscillator();
                const bassGain = this.audioContext.createGain();

                bassOsc.type = 'sine';
                bassOsc.frequency.value = 80;

                bassGain.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                bassGain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.8);

                bassOsc.connect(bassGain);
                bassGain.connect(this.audioContext.destination);

                bassOsc.start(this.audioContext.currentTime);
                bassOsc.stop(this.audioContext.currentTime + 0.8);
            },

            // 切换音乐
            toggleMusic: function() {
                this.isMusicPlaying = !this.isMusicPlaying;
                if (this.isMusicPlaying) {
                    this.playBackgroundMusic();
                }
            },

            // 切换音效
            toggleSfx: function() {
                this.isSfxEnabled = !this.isSfxEnabled;
            }
        };

        // ===== 烟花效果 - Canvas 2D =====
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 粒子数组
        let particles = [];
        let fireworks = [];

        // 马年颜色数组（金色、红色、橙色、黄色）
        const horseYearColors = [
            '#d4af37', // 金色
            '#ffd700', // 亮金色
            '#ff6b00', // 橙色
            '#ff0000', // 红色
            '#ff8c00', // 深橙色
            '#ffb347', // 柔和金色
            '#fffacd', // 柠檬绸色
            '#ffea00', // 亮黄色
            '#ff4500', // 橙红色
            '#ffd700'  // 金色（再次）
        ];

        // 烟花类
        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 8;
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.velocity = {
                    x: Math.cos(this.angle) * this.speed,
                    y: Math.sin(this.angle) * this.speed
                };
                this.trail = [];
                this.trailLength = 10;
            }

            update() {
                // 保存轨迹
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                // 移动
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                // 检查是否到达目标
                const distance = Math.sqrt(
                    Math.pow(this.targetX - this.x, 2) +
                    Math.pow(this.targetY - this.y, 2)
                );

                if (distance < 10) {
                    this.explode();
                    return false;
                }
                return true;
            }

            draw() {
                // 绘制轨迹（金色）
                ctx.beginPath();
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 绘制烟花头（白色）
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            explode() {
                // 播放爆炸音效
                AudioSystem.playExplosionSound();

                const particleCount = 100;
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(this.x, this.y));
                }
            }
        }

        // 粒子类
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                this.gravity = 0.1;
                this.friction = 0.99;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = horseYearColors[Math.floor(Math.random() * horseYearColors.length)];
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 动画循环
        function animate() {
            // 清除画布（半透明，创建拖尾效果）
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 更新和绘制烟花
            fireworks = fireworks.filter(firework => {
                firework.draw();
                return firework.update();
            });

            // 更新和绘制粒子
            particles = particles.filter(particle => {
                particle.draw();
                return particle.update();
            });

            requestAnimationFrame(animate);
        }

        // 发射烟花
        function launchFirework(x, y) {
            const targetX = x || Math.random() * canvas.width;
            const targetY = y || Math.random() * canvas.height * 0.5;
            const startX = canvas.width / 2;
            const startY = canvas.height;
            fireworks.push(new Firework(startX, startY, targetX, targetY));
        }

        // 点击事件
        canvas.addEventListener('click', (e) => {
            launchFirework(e.clientX, e.clientY);
            // 点击时发射多个烟花
            setTimeout(() => launchFirework(e.clientX - 50, e.clientY - 50), 100);
            setTimeout(() => launchFirework(e.clientX + 50, e.clientY - 50), 200);
            setTimeout(() => launchFirework(e.clientX - 50, e.clientY + 50), 300);
            setTimeout(() => launchFirework(e.clientX + 50, e.clientY + 50), 400);
        });

        // 自动播放
        function autoLaunch() {
            launchFirework();
            // 随机时间后发射下一个
            const delay = Math.random() * 2000 + 1000;
            setTimeout(autoLaunch, delay);
        }

        // 窗口大小改变
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 启动
        animate();
        autoLaunch();

        // 初始化音频系统（需要用户交互）
        const initAudio = () => {
            AudioSystem.init();
            AudioSystem.playBackgroundMusic();
            document.removeEventListener('click', initAudio);
            document.removeEventListener('touchstart', initAudio);
        };

        // 等待用户交互来初始化音频
        document.addEventListener('click', initAudio);
        document.addEventListener('touchstart', initAudio);

        // 控制按钮事件
        const musicBtn = document.getElementById('musicBtn');
        const sfxBtn = document.getElementById('sfxBtn');

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            AudioSystem.toggleMusic();
            if (AudioSystem.isMusicPlaying) {
                musicBtn.classList.add('active');
                musicBtn.classList.remove('inactive');
            } else {
                musicBtn.classList.remove('active');
                musicBtn.classList.add('inactive');
            }
        });

        sfxBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            AudioSystem.toggleSfx();
            if (AudioSystem.isSfxEnabled) {
                sfxBtn.classList.add('active');
                sfxBtn.classList.remove('inactive');
            } else {
                sfxBtn.classList.remove('active');
                sfxBtn.classList.add('inactive');
            }
        });
    </script>
</body>
</html>
